name: CI/CD with Terraform
on:
  push:
    branches:
      - master

env:
  AWS_ACCESS_KEY_ID: ${{secrets.AWS_ACCESS_KEY_ID}}
  AWS_ACCESS_SECRET_KEY: ${{secrets.AWS_ACCESS_SECRET_KEY}}
  AWS_SSH_KEY_PRIVATE: ${{secrets.AWS_SSH_KEY_PRIVATE}}
  AWS_SSH_KEY_PUBLIC: ${{secrets.AWS_SSH_KEY_PUBLIC}}
  AWS_TF_STATE_BUCKET_NAME: ${{secrets.AWS_TF_STATE_BUCKET_NAME}}
  AWS_REGION: "eu-north-1"

jobs:
  deploy-infra:
    runs-on: ubuntu-latest
    steps:
      - name: checkout the repo
        uses: actions/checkout@v4

      - name: setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform-wrapper: false

      - name: initialize Terraform
        id: init
        run: terraform init 
        working-directory: ./terraform
      
      - name: plan Terraform
        id: plan
        run: |
          terraform plan \
          -var="PUBLIC_key=AWS_SSH_KEY_PUBLIC" \
          out=PLAN 
        working-directory: ./terraform

      - name: Terraform apply
        id: apply
        run: terraform apply PLAN
        working-directory: ./terraform