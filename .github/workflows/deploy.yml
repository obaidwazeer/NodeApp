name: CI/CD with Terraform
on:
  push:
    branches:
      - master

env:
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_ACCESS_SECRET_KEY }}
  AWS_SSH_KEY_PRIVATE: ${{ secrets.AWS_SSH_KEY_PRIVATE }}
  AWS_SSH_KEY_PUBLIC: ${{ secrets.AWS_SSH_KEY_PUBLIC }}
  AWS_TF_STATE_BUCKET_NAME: ${{ secrets.AWS_TF_STATE_BUCKET_NAME }}
  AWS_REGION: "eu-north-1"

jobs:
  deploy-infra:
    runs-on: ubuntu-latest
    steps:
      - name: checkout the repo
        uses: actions/checkout@v4

      - name: setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform-wrapper: false

      - name: initialize Terraform
        run: terraform init 
        working-directory: ./terraform
      
      - name: plan Terraform
        run: |
          terraform plan \
          -var="public_key=${{ secrets.AWS_SSH_KEY_PUBLIC }}" \
          -input=false \
          -out=PLAN 
        working-directory: ./terraform

      - name: Terraform apply
        run: terraform apply -input=false PLAN
        working-directory: ./terraform

      - name: Save IP to File
        run: |
          terraform output -raw public_ip > server_ip.txt
        working-directory: ./terraform

      - name: Upload IP Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ec2-ip-address
          path: ./terraform/server_ip.txt

  deploy-app:
    runs-on: ubuntu-latest
    needs: deploy-infra
    steps:
      - name: checkout the repo
        uses: actions/checkout@v4

      - name: Download IP Artifact
        uses: actions/download-artifact@v4
        with:
          name: ec2-ip-address
          path: .

      - name: Read IP Address
        id: read-ip
        run: |
          CLEAN_IP=$(cat server_ip.txt | awk -F'::' '{print $1}')
          echo "ip_address=$CLEAN_IP" >> $GITHUB_OUTPUT


      - name: login to amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push docker image to Amazon ECR
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          REPOSITORY: my-node-ecr-repo
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $REGISTRY/$REPOSITORY:$IMAGE_TAG .
          docker push $REGISTRY/$REPOSITORY:$IMAGE_TAG

      - name: Execute remote SSH commands using password
        uses: appleboy/ssh-action@v1
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          REPOSITORY: my-node-ecr-repo
          IMAGE_TAG: ${{ github.sha }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_ACCESS_SECRET_KEY }}
          AWS_DEFAULT_REGION: eu-north-1
        with:
          host: ${{ steps.read-ip.outputs.ip_address }}
          username: ubuntu
          key: ${{ secrets.AWS_SSH_KEY_PRIVATE }}
          envs: REGISTRY,REPOSITORY,IMAGE_TAG,AWS_ACCESS_KEY_ID,AWS_SECRET_ACCESS_KEY,AWS_DEFAULT_REGION
          script: |
            sudo apt update
            sudo apt install docker.io -y
            sudo apt install awscli -y
            aws ecr get-login-password --region eu-north-1 | sudo docker login --username AWS --password-stdin $REGISTRY
            sudo docker stop myappcontainer || true
            sudo docker rm myappcontainer || true
            sudo docker pull $REGISTRY/$REPOSITORY:$IMAGE_TAG
            sudo docker run -d --name myappcontainer -p 80:8080 $REGISTRY/$REPOSITORY:$IMAGE_TAG
